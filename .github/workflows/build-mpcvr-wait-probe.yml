name: Build MPC Video Renderer stage probe

on:
  push:
    branches: [mpcvr-wait-probe-20261019]
    paths:
      - ".github/workflows/build-mpcvr-wait-probe.yml"
      - "tools/apply_mpcvr_wait_probe.py"
      - "README-WAIT-PROBE.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wait-probe:
    runs-on: windows-latest
    steps:
      - name: Checkout this build harness
        uses: actions/checkout@v6

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Clone and pin upstream source
        shell: pwsh
        run: |
          $upstreamCommit = "e55dd16fda83de20a4b4856538d8efc870ab1cb4"
          git clone --no-checkout https://github.com/clsid2/MPCVideoRenderer.git upstream
          if ($LASTEXITCODE -ne 0) { throw "git clone failed" }
          git -C upstream checkout --detach $upstreamCommit
          if ($LASTEXITCODE -ne 0) { throw "upstream commit checkout failed" }
          git -C upstream submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw "submodule checkout failed" }
          # The project's pre-build script reads this legacy ref to populate revision.h.
          git -C upstream branch Aleksoid1978/master $upstreamCommit
          if ($LASTEXITCODE -ne 0) { throw "Could not create revision metadata ref" }
          "UPSTREAM_COMMIT=$upstreamCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git -C upstream status --short
          git -C upstream rev-parse HEAD

      - name: Apply targeted stage diagnostic patch
        shell: pwsh
        run: |
          python tools/apply_mpcvr_wait_probe.py
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic patcher failed" }
          git -C upstream diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patched source failed git diff --check" }
          $rendererMarkers = Select-String -Path upstream/Source/VideoRenderer.cpp -Pattern "WAITPROBE_ENTER|WAITPROBE_EXIT|RECEIVEPROBE|PROCESSPROBE"
          if (-not $rendererMarkers) { throw "Renderer stage timing markers not found in patched source" }
          $dx11Markers = Select-String -Path upstream/Source/DX11VideoProcessor.cpp -Pattern "DX11STAGE|MAPPROBE|PRESENTPROBE"
          if (-not $dx11Markers) { throw "DX11 stage timing markers not found in patched source" }
          if (-not (Select-String -Path upstream/Source/VideoRenderer.cpp -SimpleMatch -Pattern "renderer_instance=%p process_id=%lu thread_id=%lu")) { throw "Renderer instance/thread markers missing" }
          if (-not (Select-String -Path upstream/Source/VideoRenderer.cpp -SimpleMatch -Pattern "sample_begin_time_hr=")) { throw "Wait sample entry snapshot missing" }
          if (-not (Select-String -Path upstream/Source/VideoRenderer.cpp -SimpleMatch -Pattern "state_begin=%d state_end=%d")) { throw "Wait entry/exit state snapshots missing" }
          if (-not (Select-String -Path upstream/Source/DX11VideoProcessor.cpp -SimpleMatch -Pattern "processor_instance=%p process_id=%lu thread_id=%lu")) { throw "DX11 instance/thread markers missing" }
          if (-not (Select-String -Path upstream/Source/renbase2.cpp -SimpleMatch -Pattern "decision=late_drop")) { throw "Late-drop decision context missing" }
          if (-not (Select-String -Path upstream/external/BaseClasses/renbase.cpp -SimpleMatch -Pattern "schedule_stage=advise_time")) { throw "BaseClasses scheduler failure context missing" }
          git -C upstream/external/BaseClasses diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patched BaseClasses source failed git diff --check" }
          $destructiveEventProbe = Select-String -Path upstream/Source/VideoRenderer.cpp,upstream/Source/DX11VideoProcessor.cpp -Pattern "WaitForSingleObject\s*\(\s*m_RenderEvent"
          if ($destructiveEventProbe) { throw "Unsafe diagnostic: polling auto-reset m_RenderEvent can consume the render wake-up" }
          git -C upstream diff -- Source/VideoRenderer.cpp Source/VideoRenderer.h Source/DX11VideoProcessor.cpp Source/renbase2.cpp | Out-File -FilePath MPCVideoRendererStageProbe.patch -Encoding utf8
          git -C upstream/external/BaseClasses diff -- renbase.cpp | Add-Content -Path MPCVideoRendererStageProbe.patch -Encoding utf8
          if ((Get-Item MPCVideoRendererStageProbe.patch).Length -lt 3000) { throw "Stage probe patch diff unexpectedly small" }

      - name: Build x64 Release
        shell: pwsh
        run: |
          msbuild upstream/MpcVideoRenderer.sln /nologo /m /verbosity:minimal /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed" }

      - name: Verify and package build
        shell: pwsh
        run: |
          $dll = "upstream/_bin/Filter_x64/MpcVideoRenderer64.ax"
          if (-not (Test-Path $dll)) { throw "Expected DLL missing: $dll" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $dll))
          if ($bytes.Length -lt 100000 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Output does not appear to be a valid Windows PE DLL"
          }
          $waitProbe = Select-String -Path upstream/Source/VideoRenderer.cpp -Pattern "WAITPROBE_ENTER|WAITPROBE_EXIT|RECEIVEPROBE|PROCESSPROBE"
          if ($waitProbe.Count -lt 4) { throw "Renderer timing markers missing from source" }
          $dx11Probe = Select-String -Path upstream/Source/DX11VideoProcessor.cpp -Pattern "DX11STAGE|MAPPROBE|PRESENTPROBE"
          if ($dx11Probe.Count -lt 3) { throw "DX11 timing markers missing from source" }
          if (-not (Select-String -Path upstream/Source/VideoRenderer.cpp -SimpleMatch -Pattern "sample_begin_time_hr=")) { throw "Wait sample entry snapshot missing" }
          if (-not (Select-String -Path upstream/Source/DX11VideoProcessor.cpp -SimpleMatch -Pattern "processor_instance=%p process_id=%lu thread_id=%lu")) { throw "DX11 instance/thread markers missing" }
          if (-not (Select-String -Path upstream/Source/VideoRenderer.h -Pattern "WaitForRenderTime\(\) override")) { throw "WaitForRenderTime override declaration missing" }
          if (-not (Select-String -Path upstream/Source/VideoRenderer.h -Pattern "MPCVRProbeShouldLogStage")) { throw "Shared stage-probe declarations missing" }

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $dll dist/MpcVideoRenderer64.ax
          Copy-Item MPCVideoRendererStageProbe.patch dist/
          Copy-Item tools/apply_mpcvr_wait_probe.py dist/
          Copy-Item README-WAIT-PROBE.md dist/README.txt

          @(
            "Build: MPC Video Renderer Stage Probe, experimental x64 Release"
            "Upstream repository: https://github.com/clsid2/MPCVideoRenderer"
            "Upstream commit: $env:UPSTREAM_COMMIT"
            "Architecture: x64"
            "Configuration: Release"
            "Compiler: Visual Studio 2022 MSBuild"
            "Patch: MPCVideoRendererStageProbe.patch"
            "New log: %LOCALAPPDATA%\MPCVideoRendererWaitProbeDiag.txt"
            "This is a diagnostic-only experimental build, not an official release."
          ) | Set-Content -Encoding utf8 dist/BUILD-INFO.txt

          $hash = (Get-FileHash dist/MpcVideoRenderer64.ax -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MpcVideoRenderer64.ax" | Set-Content -Encoding ascii dist/SHA256.txt

          Compress-Archive -Path dist/* -DestinationPath MPCVideoRenderer-StageProbe-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MPCVideoRenderer-StageProbe-x64
          path: MPCVideoRenderer-StageProbe-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish diagnostic pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "mpcvr-wait-probe-20261019-${{ github.run_number }}"
          $notes = @"
          Experimental diagnostic-only x64 Release build of MPC Video Renderer.
          Upstream commit: $env:UPSTREAM_COMMIT
          Adds bounded WaitForRenderTime entry/exit records plus slow/failing timing records for the full Receive call, ProcessSample, DX11 CopySample/Render stages, individual staging-texture Map calls, and DXGI Present. Wait/Receive records include renderer instance, process/thread IDs, sample timestamps at wait entry and exit, and before/after state snapshots so separate instances and lifecycle transitions can be distinguished.
          RECEIVEPROBE now also carries scheduler_context for selected rejected samples: the renderer late-drop decision and timing/quality inputs, or a specific GetSampleTimes/AdviseTime scheduling failure. The context is appended to an existing Receive record and does not add per-frame logging in the scheduler.
          Normal stage records use a 20 ms threshold; stalls of 100 ms or more have a separate bounded budget. The first 12 WaitForRenderTime calls after each segment/flush boundary are traced.
          It deliberately never polls m_RenderEvent: WaitForSingleObject on this auto-reset event can consume the render wake-up and freeze presentation.
          The rendering decisions are unchanged. The scheduler probe stores context in thread-local memory and performs no file I/O itself; slow/failing stage calls append records synchronously to the diagnostic text file.
          New log: %LOCALAPPDATA%\MPCVideoRendererWaitProbeDiag.txt
          Not an official upstream release. Back up the existing renderer and restore it after testing.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create $tag MPCVideoRenderer-StageProbe-x64.zip --repo "${{ github.repository }}" --title "MPC Video Renderer Stage Probe x64 (experimental)" --notes-file release-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "gh release creation failed" }
