name: Check VapourSynth diagnostic workflow syntax

on:
  push:
    branches:
      - experiment/vs-frame-pacing-diagnostics

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Confirm workflow is parsed
        shell: pwsh
        run: |
          Write-Host "Workflow YAML parsed successfully."
