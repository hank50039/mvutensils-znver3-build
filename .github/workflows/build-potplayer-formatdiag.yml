name: Build PotPlayer VapourSynth diagnostics with original queue behavior

on:
  push:
    branches: [build-potplayer-cap28-formatdiag, experiment/cap28-startpoint-diag-20261021, experiment/startpoint-scheduler-correlation-20261021, experiment/startpoint-burst-txt-20261021]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Checkout upstream AviSynth Filter at log-matched commit
        uses: actions/checkout@v4
        with:
          repository: CrendKing/avisynth_filter
          ref: a07ccda967261832233185f1e1d9979ba12593c0
          path: avisynth_filter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply format and Receive diagnostics only
        shell: pwsh
        run: |
          python .github/scripts/patch_vsfilter_diag.py avisynth_filter *> apply-patch.log
          $patchExitCode = $LASTEXITCODE
          Get-Content apply-patch.log | Write-Output
          if ($patchExitCode -ne 0) { throw "Diagnostic patch failed with exit code $patchExitCode." }

      - name: Authenticate GitHub dependency metadata queries
        shell: pwsh
        run: |
          python .github/scripts/patch_build_dependency_auth.py avisynth_filter/build.ps1

      - name: Build Release x64
        shell: pwsh
        working-directory: avisynth_filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./build.ps1 -Configuration Release -Platform x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify diagnostic markers and binary
        shell: pwsh
        run: |
          $src = Get-Content avisynth_filter/filter_common/src/filter.cpp -Raw
          $frame = Get-Content avisynth_filter/vapoursynth_filter/src/frame_handler.cpp -Raw
          if ($src -notmatch 'FORMAT_DIFF_BYTE' -or $src -notmatch 'RECVTRACE AddInputSample_done' -or $src -notmatch 'DYNAMIC_MT') {
            throw "Expected diagnostic source markers are missing."
          }
          if ($src -notmatch 'DYNAMIC_MT_FASTPATH applied' -or $src -notmatch '_isInputMediaTypeChanged = !traceMetadataOnlyCandidate') {
            throw "The tested BT.709 metadata-only Fast Path must be preserved."
          }
          if ($frame -notmatch 'submit_qpc' -or $frame -notmatch 'callback_qpc' -or $frame -notmatch 'wait_end_qpc') { throw 'Common QPC correlation markers are missing.' }
          if ($frame -notmatch 'STARTPOINTDIAG AddInputSample_wait' -or $frame -notmatch 'STARTPOINTDIAG OutputFrame_ready' -or $frame -notmatch 'STARTPOINTDIAG OutputFrame_submit' -or $frame -notmatch 'STARTPOINTDIAG OutputFrame_callback_lock') {
            throw "Sparse start-position wait, output-frame callback latency, async-submit time, and callback-lock timing diagnostics are missing."
          }
          $envSource = Get-Content avisynth_filter/filter_common/src/environment.cpp -Raw
          if ($envSource -notmatch '_logPath.replace_extension\(L"\.txt"\)') { throw 'The Filter .txt logging destination patch is missing.' }
          $header = Get-Content avisynth_filter/vapoursynth_filter/src/frame_handler.h -Raw
          if ($header -notmatch '_outputRequestTimes') {
            throw "Per-frame request timestamp tracking is missing."
          }
          if ($frame -notmatch 'MAX_PENDING_OUTPUT_FRAMES = 28') {
            throw "The tested CAP28 request bound is missing."
          }
          if ($frame -match 'CAP28DIAG_DELIVER') {
            throw "Per-frame delivery instrumentation must remain disabled."
          }
          $dllCandidates = Get-ChildItem avisynth_filter -Recurse -File -Filter *.ax |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]Release[\\/]' }
          $dll = $dllCandidates | Where-Object { $_.Name -eq 'vapoursynth_filter_64.ax' } | Select-Object -First 1
          if (-not $dll) { $dll = $dllCandidates | Select-Object -First 1 }
          if (-not $dll) {
            Get-ChildItem avisynth_filter -Recurse -File | Where-Object { $_.Extension -eq '.ax' } | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Output
            throw "Built .ax filter not found under the x64 Release output directory."
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $dll.FullName (Join-Path dist $dll.Name) -Force
          $pdb = Get-ChildItem avisynth_filter -Recurse -File -Filter vapoursynth_filter_x64.pdb | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName dist/vapoursynth_filter_x64.pdb -Force }
          @(
            "Source repository: CrendKing/avisynth_filter"
            "Source commit: a07ccda967261832233185f1e1d9979ba12593c0"
            "Configuration: Release x64"
            "Output: vapoursynth_filter_x64.ax"
            "Diagnostics: FORMAT_DIFF_*, RECVTRACE, DYNAMIC_MT, STARTPOINTDIAG AddInputSample_wait, OutputFrame_ready, OutputFrame_submit, OutputFrame_callback_lock"
            "Diagnostic logfile: configured log path with .txt extension (no INI/registry write)"
            "BT.709 metadata-only Fast Path: retained"
            "CAP28 request bound: retained at the previously validated 28 pending outputs"
            "AddInputSample wait predicate, async request ordering, and delivery order: unchanged"
            "Added thresholded logs for AddInputSample waits >= 20 ms or pending format/reload state"
            "Added per-output-frame request-to-callback latency logs only at >= 20 ms or frame failure"
            "Added getFrameAsync synchronous submit timing logs only at >= 5 ms"
            "Added callback request-map mutex acquisition/lookup timing logs only at >= 5 ms"
            "No CAP28 queue timing instrumentation is added"
            "Purpose: identify whether a specific late output-frame callback aligns with start-position stutter"
            "This remains a diagnostic build; playback performance is not claimed."
          ) | Set-Content dist/BUILD-INFO.txt
          Get-FileHash (Join-Path dist $dll.Name) -Algorithm SHA256 | Format-List | Out-String | Set-Content dist/SHA256.txt

      - name: Upload compiled filter
        uses: actions/upload-artifact@v4
        with:
          name: potplayer-vsfilter-startpoint-burst-txt-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload patch/build diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potplayer-vapoursynth-original-queue-build-debug-log
          path: |
            apply-patch.log
            avisynth_filter/x64/Release/*.log
          if-no-files-found: warn
          retention-days: 14
