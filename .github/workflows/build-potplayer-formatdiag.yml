name: Build PotPlayer VapourSynth diagnostics with original queue behavior

on:
  push:
    branches: [build-potplayer-cap28-formatdiag, experiment/cap28-startpoint-diag-20261021]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Checkout upstream AviSynth Filter at log-matched commit
        uses: actions/checkout@v4
        with:
          repository: CrendKing/avisynth_filter
          ref: a07ccda967261832233185f1e1d9979ba12593c0
          path: avisynth_filter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply format and Receive diagnostics only
        shell: pwsh
        run: |
          python .github/scripts/patch_vsfilter_diag.py avisynth_filter *> apply-patch.log
          $patchExitCode = $LASTEXITCODE
          Get-Content apply-patch.log | Write-Output
          if ($patchExitCode -ne 0) { throw "Diagnostic patch failed with exit code $patchExitCode." }

      - name: Build Release x64
        shell: pwsh
        working-directory: avisynth_filter
        run: |
          ./build.ps1 -Configuration Release -Platform x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify diagnostic markers and binary
        shell: pwsh
        run: |
          $src = Get-Content avisynth_filter/filter_common/src/filter.cpp -Raw
          $frame = Get-Content avisynth_filter/vapoursynth_filter/src/frame_handler.cpp -Raw
          if ($src -notmatch 'FORMAT_DIFF_BYTE' -or $src -notmatch 'RECVTRACE AddInputSample_done' -or $src -notmatch 'DYNAMIC_MT') {
            throw "Expected diagnostic source markers are missing."
          }
          if ($src -match 'DYNAMIC_MT_FASTPATH applied' -or $src -match '_isInputMediaTypeChanged = !traceMetadataOnlyCandidate') {
            throw "Unsafe BT.709 metadata-only fast path must remain disabled; preserve normal media-type reconfiguration."
          }
          if ($frame -match 'MAX_PENDING_OUTPUT_FRAMES|CAP28DIAG_|CAP28') {
            throw "FrameHandler must preserve upstream queue/request/delivery behavior; no CAP28 patch is allowed."
          }
          $dllCandidates = Get-ChildItem avisynth_filter -Recurse -File -Filter *.ax |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]Release[\\/]' }
          $dll = $dllCandidates | Where-Object { $_.Name -eq 'vapoursynth_filter_64.ax' } | Select-Object -First 1
          if (-not $dll) { $dll = $dllCandidates | Select-Object -First 1 }
          if (-not $dll) {
            Get-ChildItem avisynth_filter -Recurse -File | Where-Object { $_.Extension -eq '.ax' } | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Output
            throw "Built .ax filter not found under the x64 Release output directory."
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $dll.FullName (Join-Path dist $dll.Name) -Force
          $pdb = Get-ChildItem avisynth_filter -Recurse -File -Filter vapoursynth_filter_x64.pdb | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName dist/vapoursynth_filter_x64.pdb -Force }
          @(
            "Source repository: CrendKing/avisynth_filter"
            "Source commit: a07ccda967261832233185f1e1d9979ba12593c0"
            "Configuration: Release x64"
            "Output: vapoursynth_filter_x64.ax"
            "Diagnostics: FORMAT_DIFF_*, RECVTRACE, DYNAMIC_MT"
            "BT.709 metadata-only fast path: disabled; normal media-type reconfiguration preserved"
            "VapourSynth frame_handler.cpp and frame_handler.h: unmodified upstream"
            "Output queue/request/callback/delivery/reset behavior: unmodified upstream"
            "No CAP28 queue limit or CAP28 diagnostic marker is added"
            "Existing per-frame filter logs remain available for offline timing correlation"
            "Purpose: collect format/Receive traces while preserving original interpolation flow"
            "This remains a diagnostic build; playback performance is not claimed."
          ) | Set-Content dist/BUILD-INFO.txt
          Get-FileHash (Join-Path dist $dll.Name) -Algorithm SHA256 | Format-List | Out-String | Set-Content dist/SHA256.txt

      - name: Upload compiled filter
        uses: actions/upload-artifact@v4
        with:
          name: potplayer-vapoursynth-formatdiag-original-queue-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload patch/build diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potplayer-vapoursynth-original-queue-build-debug-log
          path: |
            apply-patch.log
            avisynth_filter/x64/Release/*.log
          if-no-files-found: warn
          retention-days: 14
