name: Build source-frame continuity fix - no DShow quality skip - dual BT709 CAP28 EOF

on:
  push:
    branches: [build-potplayer-cap28-formatdiag, experiment/cap28-startpoint-diag-20261021, experiment/startpoint-scheduler-correlation-20261021, experiment/startpoint-burst-txt-20261021, experiment/bt709-precheck-fastpath-20261021, release/bt709-dual-fastpath-cap28-no-logs-20261021, experiment/eof-cap28-drain-20261021, experiment/eof-drain-eos-complete-20261021, experiment/eof-source-bound-shorttail-20261021, experiment/eof-stall-watchdiag-20261021, experiment/eof-dependency-trace-20261021, experiment/eof-duration-deadlock-fix-dlogs-20261021, release/eof-durationfix-dualfastpath-cap28-nolog-20261022, experiment/vsfilter-preserve-decoder-frames-no-dshow-quality-skip-20261022]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Checkout upstream AviSynth Filter at log-matched commit
        uses: actions/checkout@v4
        with:
          repository: CrendKing/avisynth_filter
          ref: a07ccda967261832233185f1e1d9979ba12593c0
          path: avisynth_filter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply clean production dual fastpaths + CAP28 patch
        shell: pwsh
        run: |
          python .github/scripts/patch_vsfilter_diag.py avisynth_filter *> apply-patch.log
          $patchExitCode = $LASTEXITCODE
          Get-Content apply-patch.log | Write-Output
          if ($patchExitCode -ne 0) { throw "Release patch failed with exit code $patchExitCode." }

      - name: Authenticate GitHub dependency metadata queries
        shell: pwsh
        run: |
          python .github/scripts/patch_build_dependency_auth.py avisynth_filter/build.ps1

      - name: Build Release x64
        shell: pwsh
        working-directory: avisynth_filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./build.ps1 -Configuration Release -Platform x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify optimized production release and DLL
        shell: pwsh
        run: |
          $src = Get-Content avisynth_filter/filter_common/src/filter.cpp -Raw
          $frame = Get-Content avisynth_filter/vapoursynth_filter/src/frame_handler.cpp -Raw
          $envSource = Get-Content avisynth_filter/filter_common/src/environment.cpp -Raw
          $header = Get-Content avisynth_filter/vapoursynth_filter/src/frame_handler.h -Raw
          if ($src -notmatch 'IsOnlyVideoInfo2ControlFlagsChanged' -or $src -notmatch '_isInputMediaTypeChanged = !metadataOnlyBt709') {
            throw "Tested Receive metadata-only Fast Path has been lost."
          }
          if ($src -notmatch 'IsOnlyVideoInfo2ControlFlagsChanged\(m_pInput->CurrentMediaType\(\), \*mtIn\)') {
            throw "Tested Precheck metadata-only Fast Path has been lost."
          }
          if ($src -notmatch '#ifndef AVSF_VAPOURSYNTH\s+if \(ShouldSkipFrame\(pSample\)\)') {
            throw "VapourSynth still inherits the frame-dropping quality-control path."
          }
          if ($src -match 'RAW_RECEIVE|FILTER_SKIP|StartSeekProbe|TraceUpstreamInput') {
            throw "Old diagnostic instrumentation unexpectedly present."
          }

          if ($frame -notmatch 'MAX_PENDING_OUTPUT_FRAMES = 28' -or $frame -notmatch '_outputFrames.size\(\) >= MAX_PENDING_OUTPUT_FRAMES') {
            throw "CAP28 bound must be retained."
          }
          if ($frame -notmatch 'auto FrameHandler::RequestPendingOutputFrames\(\) -> void' -or $frame -notmatch '_maxRequestOutputFrameNb' -or $frame -notmatch 'RequestPendingOutputFrames\(\);' -or $header -notmatch 'auto RequestPendingOutputFrames\(\) -> void') {
            throw "Automatic refill on frame delivery, especially after decoder EOS, is missing."
          }
          $filterHeader = Get-Content avisynth_filter/filter_common/src/filter.h -Raw
          if ($src -notmatch 'CSynthFilter::EndOfStream\(\)' -or $filterHeader -notmatch 'auto EndOfStream\(\) -> HRESULT override') {
            throw "Explicit DirectShow EndOfStream override missing."
          }
          if ($frame -notmatch 'SignalInputEndOfStream\(\)' -or $frame -notmatch 'DeliverEndOfStreamIfDrained\(\)' -or $frame -notmatch '_inputEosSeen' -or $frame -notmatch '_eosForwarded' -or $header -notmatch 'SignalInputEndOfStream\(\)') {
            throw "Asynchronous EOS deferred until queue-drained and final source frame duration fix is missing."
          }
          if ($frame -notmatch 'std::memory_order_acquire' -or $frame -notmatch 'std::memory_order_release' -or $frame -notmatch 'SourceAvgFrameDuration\(\)' -or $frame -notmatch '_nextSourceFrameNb < Environment::GetInstance\(\).GetInitialSrcBuffer\(\)') {
            throw "EOS source lookahead resolution / short-tail script startup / last frame request bound are missing."
          }
          if ($frame -notmatch 'EOS_WAIT_TIMEOUT' -or $frame -notmatch 'CALLBACK_LOST_FAILED_FRAME' -or $frame -notmatch 'OUTPUT_PTS' -or $frame -notmatch 'SOURCE_LOOKAHEAD' -or $frame -notmatch 'OUTPUT_DELIVER_DONE' -or $frame -notmatch 'EofWatch' -or $frame -notmatch 'SOURCE_WAIT_TIMEOUT' -or $frame -notmatch 'SOURCE_RESULT' -or $frame -notmatch 'FLUSH_SIGNAL') {
            throw "Narrow EOF watchdog markers missing."
          }
          if ($frame -notmatch 'durationNumElementsBefore <= 0' -or $frame -notmatch 'durationDenElementsBefore <= 0') {
            throw "Terminal duration -1 missing-key bugfix absent."
          }
          if ($frame -notmatch 'inline auto EofWatch\(bool, const wchar_t\*, \.\.\.\) noexcept -> void \{\}' -or $frame -match 'CreateDirectoryW|_wfopen_s|fwprintf_s|vfwprintf_s|QueryPerformanceCounter|g_eofWatchFile|g_eofWatchEnabled|VapourSynth_EOFWatch_') {
            throw "Diagnostic EOFWatch sink remains or no-op verification failed."
          }
          if ($frame -match 'while \(_nextOutputFrameNb <= maxRequestOutputFrameNb\)') {
            throw "Old input-only CAP28 request loop should be replaced by the refill pump."
          }
          if ($frame -match '_outputRequestTimes' -or $header -match '_outputRequestTimes') {
            throw "Diagnostic timing map must not exist."
          }
          if ($envSource -match '_wfsopen' -or $envSource -match '_logPath.replace_extension') {
            throw "Logfile creation was not fully removed."
          }
          $allSrc = $src + $frame + $envSource + $header
          if ($allSrc -match 'STARTPOINTDIAG|RECVTRACE|FORMAT_DIFF|DYNAMIC_MT_FASTPATH|DYNAMIC_MT_PRECHECK_FASTPATH|CAP28DIAG|callback_qpc') {
            throw "Diagnostic code still present."
          }
          $dllCandidates = Get-ChildItem avisynth_filter -Recurse -File -Filter *.ax |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]Release[\\/]' }
          $dll = $dllCandidates | Where-Object { $_.Name -eq 'vapoursynth_filter_64.ax' } | Select-Object -First 1
          if (-not $dll) { $dll = $dllCandidates | Select-Object -First 1 }
          if (-not $dll) { throw "Missing Release x64 .ax binary" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $dll.FullName (Join-Path dist $dll.Name) -Force
          @(
            "Source repository: CrendKing/avisynth_filter"
            "Pinned source commit: a07ccda967261832233185f1e1d9979ba12593c0"
            "Configuration: Release x64"
            "Kept: exact BT709 Receive Fast Path; exact BT709 CheckInputType Precheck Fast Path"
            "Kept: CAP28 pending output request bound and original async/delivery frame order"
            "Fix: after completed frame delivery, refill CAP28 from highest eligible source-derived frame index"
            "Fix: continue requesting remaining eligible outputs when decoder reaches EOS and no further input samples arrive"
            "Fix: override CTransformFilter default EOS, notify renderer only after all output frames are delivered"
            "Fix: ensure final input source frame duration properties exist for last-frame dependencies"
            "Fix: wake blocked lookahead GetSourceFrame calls at EOF and supply last real source frame"
            "Fix: initialize main script at upstream EOF when fewer than InitialSrcBuffer frames remain following a seek"
            "Fix: include final source presentation interval in bounded output watermark"
              "No regular Filter log output and no MVUtensils FrameTimingDiag log"
                  "Confirmed bug: VSAPI mapNumElements(-1) for missing duration, not 0; corrected terminal frame check to <= 0"
            "Clean experimental x64 release: no diagnostic logfile or additional frame-level tracing"
            "Removed: request/callback QPC diagnostics, additional maps, diagnostic log calls, per-frame telemetry"
            "Disabled: original Environment logfile creation even when configured in INI"
            "Untouched: VapourSynth interpolation script; input/output pixel-format conversion; colorspace updates"
            "Scope: exact VIDEOINFOHEADER2 dwControlFlags 0 to 0x2880A581, other media type changes use upstream behavior"
            "Companion: use non-diagnostic MVUtensils AVX2 DLL to disable its separate FrameTimingDiag log"
            "A/V continuity fix: bypass inherited CVideoTransformFilter::ShouldSkipFrame() in VapourSynth only; retain all source sample PTS and decoded video frames"
          ) | Set-Content dist/BUILD-INFO.txt
          Get-FileHash (Join-Path dist $dll.Name) -Algorithm SHA256 | Format-List | Out-String | Set-Content dist/SHA256.txt

      - name: Upload compiled filter
        uses: actions/upload-artifact@v4
        with:
          name: potplayer-vsfilter-no-dshow-quality-frame-skip-eof-fixed-4k90-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload patch/build diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potplayer-vsfilter-release-build-logs
          path: |
            apply-patch.log
            avisynth_filter/x64/Release/*.log
          if-no-files-found: warn
          retention-days: 14
