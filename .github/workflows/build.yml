name: Build clean Zen 3 AVX2 LTO comparison

on:
  push:
    branches: [main, mvu-frame-stage-diag-20261020, mvu-lto-bench-20261020]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout build instructions
        uses: actions/checkout@v6

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-fftw
            mingw-w64-clang-x86_64-git
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-python-pip
            mingw-w64-clang-x86_64-python-wheel
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-uv
            mingw-w64-clang-x86_64-zimg

      - name: Prepare identical clean source trees
        run: |
          git clone https://github.com/myrsloik/mvutensils.git upstream
          cd upstream
          git checkout 4360d2ccfe3dc943c532e9ea7cd39c51dc0fd315
          cd ..
          cp -a upstream upstream-nolto
          cp -a upstream upstream-lto
          echo "Pinned upstream commit: 4360d2ccfe3dc943c532e9ea7cd39c51dc0fd315"

      - name: Build clean LTO-off and LTO-on variants
        run: |
          set -e
          mkdir -p dist/extracted

          for variant in upstream-nolto upstream-lto; do
            cd "$variant"

            python - <<'PY'
          from pathlib import Path
          p = Path("meson.build")
          s = p.read_text(encoding="utf-8")
          old = "'1': ['-march=x86-64-v3'],"
          new = "'1': ['-march=x86-64-v3', '-mtune=znver3'],"
          if s.count(old) != 1:
              raise SystemExit("Could not uniquely locate the AVX2 compiler setting; refusing to patch.")
          p.write_text(s.replace(old, new), encoding="utf-8")
          print("Applied identical AVX2 flags: -march=x86-64-v3 -mtune=znver3")
          PY

            if [ "$variant" = "upstream-lto" ]; then
              LTO=true
              LABEL="LTO enabled"
            else
              LTO=false
              LABEL="LTO disabled"
            fi

            uv build -Csetup-args="-Dprefer_static=true" -Csetup-args="-Dcpp_link_args=-static" -Csetup-args="-Db_lto=$LTO"

            python - "$variant" "$LTO" <<'PY'
          from pathlib import Path
          import sys, zipfile
          variant, lto = sys.argv[1], sys.argv[2]
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"{variant}: expected one wheel, found {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as z:
              names = [n for n in z.namelist() if n.endswith("/mvutensils.avx2.dll")]
              if len(names) != 1:
                  raise SystemExit(f"{variant}: expected one AVX2 DLL, found {len(names)}")
              dll = z.read(names[0])
          if not dll.startswith(b"MZ"):
              raise SystemExit(f"{variant}: DLL is not a Windows PE file")
          out = Path("..") / "dist" / "extracted" / variant / "mvutensils.avx2.dll"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(dll)
          (out.parent / "BUILD-INFO.txt").write_text(
              f"Variant: {variant}\nLTO: {lto}\n"
              "Compiler tuning: -mtune=znver3\n"
              "AVX2 ISA floor: -march=x86-64-v3\n"
              "Instrumentation: none; clean upstream source except for compiler flags\n"
              "Tile size: upstream default 64x64; unchanged\n"
              "Upstream commit: 4360d2ccfe3dc943c532e9ea7cd39c51dc0fd315\n",
              encoding="utf-8")
          print(f"Extracted clean {variant} AVX2 DLL: {len(dll):,} bytes")
          PY
            strip "../dist/extracted/$variant/mvutensils.avx2.dll"
            cd ..
          done

      - name: Package and verify clean comparison DLLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path("dist/extracted")
          readme = """Clean MVUtensils AVX2 comparison builds

          Both DLLs use the same pinned upstream source and the same -march=x86-64-v3 -mtune=znver3 flags.
          The only intended build setting difference is Meson Link-Time Optimization (LTO): on versus off.
          No diagnostic timing instrumentation or interpolation-source edits are included.
          The upstream 64x64 tile size and interpolation algorithm are unchanged.

          Test one variant at a time:
          1. Back up the currently installed mvutensils.avx2.dll.
          2. Extract the selected ZIP and replace only mvutensils.avx2.dll.
          3. Keep every other MVUtensils DLL, manifest, and VapourSynth setting unchanged.
          4. Repeat the same PotPlayer 4K clip and compare equivalent playback/seek sections.
          5. Restore the backup when finished.
          These are experimental comparison builds, not official releases.
          """

          variants = [
              ("upstream-nolto", "MVUtensils-Clean-NoLTO-AVX2.zip"),
              ("upstream-lto", "MVUtensils-Clean-LTO-AVX2.zip"),
          ]
          for folder, archive_name in variants:
              d = root / folder
              dll = d / "mvutensils.avx2.dll"
              info = d / "BUILD-INFO.txt"
              if not dll.is_file() or dll.stat().st_size < 1_000_000:
                  raise SystemExit(f"Missing or implausibly small DLL: {dll}")
              if dll.read_bytes()[:2] != b"MZ":
                  raise SystemExit(f"Invalid PE header: {dll}")
              with zipfile.ZipFile(Path("dist") / archive_name, "w", zipfile.ZIP_DEFLATED) as z:
                  z.write(dll, "mvutensils.avx2.dll")
                  z.write(info, "BUILD-INFO.txt")
                  z.writestr("README.txt", readme)
              print(f"Packaged {archive_name}: {(Path('dist') / archive_name).stat().st_size:,} bytes")

          (Path("dist") / "BUILD-SUMMARY.txt").write_text(
              "Clean paired build completed.\n"
              "Pinned upstream: 4360d2ccfe3dc943c532e9ea7cd39c51dc0fd315\n"
              "Shared flags: -march=x86-64-v3 -mtune=znver3\n"
              "Pair difference: LTO off vs LTO on\n"
              "Diagnostic instrumentation: none\n"
              "Tile size: unchanged upstream 64x64\n",
              encoding="utf-8")
          PY

      - name: Upload clean comparison artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mvutensils-clean-lto-comparison
          path: |
            dist/MVUtensils-Clean-NoLTO-AVX2.zip
            dist/MVUtensils-Clean-LTO-AVX2.zip
            dist/BUILD-SUMMARY.txt
          if-no-files-found: error
          retention-days: 14
