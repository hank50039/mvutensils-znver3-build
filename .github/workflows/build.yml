name: Build test MVUtensils Zen3 x64 - isolated video CPU affinity for WASAPI Exclusive

on:
  push:
    branches: [main, release/bt709-dual-fastpath-cap28-no-logs-20261021, experiment/mvutensils-zen3-video-affinity-32-20261022]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout build instructions
        uses: actions/checkout@v6

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-fftw
            mingw-w64-clang-x86_64-git
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-python-pip
            mingw-w64-clang-x86_64-python-wheel
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-uv
            mingw-w64-clang-x86_64-zimg

      - name: Clone upstream source
        run: |
          git clone https://github.com/myrsloik/mvutensils.git upstream
          cd upstream
          git checkout 4360d2ccfe3dc943c532e9ea7cd39c51dc0fd315
          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --oneline

      - name: Apply and commit Zen 3 tuning to AVX2 build variant only
        run: |
          cd upstream
          python - <<'PY'
          from pathlib import Path
          p = Path("meson.build")
          s = p.read_text(encoding="utf-8")
          old = "'1': ['-march=x86-64-v3'],"
          new = "'1': ['-march=x86-64-v3', '-mtune=znver3'],"
          if s.count(old) != 1:
              raise SystemExit("Could not uniquely locate the upstream AVX2 march setting; refusing to patch.")
          p.write_text(s.replace(old, new), encoding="utf-8")
          print("Patched AVX2 variant: -march=x86-64-v3 -mtune=znver3")
          PY
          git add meson.build
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Apply Zen 3 tuning to AVX2 build variant"
          echo "PATCHED_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git show --stat --oneline HEAD

      - name: Apply scoped Windows video CPU affinity isolation (30 of 32)
        run: |
          python .github/scripts/patch_mvutensils_affinity.py upstream
          cd upstream
          git add src/FlowFPS.cpp src/Analyse.cpp src/VideoAffinityScope.h
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Experimental scoped affinity on Analyse/FlowFPS to leave two CPUs free for audio"
          python - <<'PY'
          from pathlib import Path
          f = Path("src/FlowFPS.cpp").read_text(encoding="utf-8")
          a = Path("src/Analyse.cpp").read_text(encoding="utf-8")
          h = Path("src/VideoAffinityScope.h").read_text(encoding="utf-8")
          assert f.count("ScopedVideoComputeAffinity isolateVideoWork;") == 1
          assert a.count("ScopedVideoComputeAffinity isolateVideoWork;") == 1
          assert "SetThreadAffinityMask" in h and "SetThreadPriority" not in h
          assert "SetThreadPriority" in h
          print("Confirmed scoped Windows video CPU affinity experiment; no pixel kernels changed.")
          PY

      - name: Build and verify wheel/source distribution
        run: |
          cd upstream
          uv build -Csetup-args="-Dprefer_static=true" -Csetup-args="-Dcpp_link_args=-static"
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          sdists = list(dist.glob("*.tar.gz"))
          wheels = list(dist.glob("*.whl"))
          if len(sdists) != 1 or len(wheels) != 1:
              raise SystemExit(f"Expected one sdist and one wheel; found {len(sdists)} and {len(wheels)}")

          expected = "'1': ['-march=x86-64-v3', '-mtune=znver3'],"
          with tarfile.open(sdists[0], "r:gz") as archive:
              matches = []
              for member in archive.getmembers():
                  if member.isfile() and member.name.endswith("meson.build"):
                      source = archive.extractfile(member).read().decode("utf-8")
                      if "march_levels = {" in source:
                          matches.append((member.name, source))
              if len(matches) != 1:
                  raise SystemExit(f"Expected one primary Meson build file containing march_levels; found {len(matches)}")
              name, source = matches[0]
              if expected not in source:
                  raise SystemExit(f"Verification failed: Zen 3 tuning flag is missing from packaged {name}.")
          print(f"Verified: {name} contains the requested -mtune=znver3 AVX2 setting.")
          with tarfile.open(sdists[0], "r:gz") as archive:
              members = {m.name: m for m in archive.getmembers() if m.isfile()}
              found = [n for n in members if n.endswith("/src/VideoAffinityScope.h")]
              if len(found) != 1:
                  raise SystemExit(f"Expected single audio scheduling header in source package, found {len(found)}")
              data = archive.extractfile(members[found[0]]).read()
              if b"SetThreadAffinityMask" not in data:
                  raise SystemExit("Video-worker scoped CPU affinity patch absent in packaged header")
          print("Verified: scoped affinity experiment present in packaged source.")

          with zipfile.ZipFile(wheels[0]) as archive:
              dlls = [n for n in archive.namelist() if n.endswith("/mvutensils.avx2.dll")]
              if len(dlls) != 1:
                  raise SystemExit(f"Expected one AVX2 DLL in wheel; found {len(dlls)}")
              dll = archive.read(dlls[0])
              if not dll.startswith(b"MZ"):
                  raise SystemExit("Verification failed: the AVX2 payload is not a Windows PE file.")
          print(f"Verified: wheel contains Windows AVX2 DLL ({len(dll):,} bytes).")
          PY
          mkdir -p ../dist
          cp dist/*.whl ../dist/
          cp dist/*.tar.gz ../dist/
          echo "Built from upstream commit: $UPSTREAM_COMMIT" > ../dist/BUILD-INFO.txt
          echo "Patched source commit: $PATCHED_SOURCE_COMMIT" >> ../dist/BUILD-INFO.txt
          echo "Compiler: Clang (MSYS2 CLANG64)" >> ../dist/BUILD-INFO.txt
          echo "Extra flag: -mtune=znver3; AVX2 ISA floor retained as -march=x86-64-v3" >> ../dist/BUILD-INFO.txt
          echo "EXPERIMENT: Windows-only scoped CPU affinity restricting Analyse+FlowFPS computation to 30 of 32 CPUs" >> ../dist/BUILD-INFO.txt
          echo "DO NOT replace clean production build except for A/B testing; keep original DLL backup" >> ../dist/BUILD-INFO.txt
          echo "Source-distribution verification: passed" >> ../dist/BUILD-INFO.txt

      - name: Normalize wheel tag and strip DLL
        run: |
          cd dist
          wheel tags --remove --python-tag py3 --abi-tag none *.whl
          wheel unpack --dest unpacked *.whl
          rm *.whl
          strip $(find unpacked -name '*.dll')
          wheel pack unpacked/*

      - name: Package clean AVX2 DLL for release
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path("dist")
          dlls = list((root / "unpacked").rglob("mvutensils.avx2.dll"))
          if len(dlls) != 1:
              raise SystemExit(f"Expected one AVX2 DLL in wheel, found {len(dlls)}")
          payload = dlls[0].read_bytes()
          if not payload.startswith(b"MZ") or b"FrameTimingDiag" in payload:
              raise SystemExit("Not a clean, non-instrumented Windows AVX2 DLL")
          out = root / "MVUtensils-Zen3-AVX2-VideoAffinity-32Threads-Experimental.zip"
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as z:
              z.write(dlls[0], "mvutensils.avx2.dll")
              z.writestr("README.txt", (
                  "EXPERIMENTAL MVUtensils AVX2 Release for Ryzen Zen 3.\n"
                  "Built from pinned upstream plus -march=x86-64-v3 -mtune=znver3 and scoped video CPU-affinity patch.\n"
                  "No diagnostic timing instrumentations or log files.\n"
                  "Windows only: Analyse/FlowFPS computations avoid 2 logical CPUs, thread affinity restored upon return. No pixel algorithm changes.\n"
                  "Keep core.num_threads = 32 for A/B test of WASAPI Exclusive audio; run with 32 available logical CPUs.\n"
                  "Affinity restriction may lower 4K90 throughput: check for video drops as well as audio glitches.\n"
                  "Back up existing DLL and replace mvutensils.avx2.dll only.\n"
                  "Combine with the previously validated fully clean dual-fastpath CAP28 AV sync EOF AX.\n"
              ))
          print(f"Clean release DLL: {len(payload)} bytes; package {out.stat().st_size} bytes")
          PY

      - name: Upload verified Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mvutensils-zen3-wasapi-video-affinity-32threads-experiment-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
